<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 测试工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }
        
        .test-group {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 12px;
            border: 2px solid #e5e7eb;
        }
        
        .test-group h2 {
            color: #374151;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #d1d5db;
        }
        
        .success {
            color: #059669;
        }
        
        .error {
            color: #dc2626;
        }
        
        .info {
            color: #2563eb;
        }
        
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 600;
            margin-right: 10px;
        }
        
        .status.ok {
            background: #d1fae5;
            color: #059669;
        }
        
        .status.fail {
            background: #fee2e2;
            color: #dc2626;
        }
        
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 API 连通性测试工具</h1>
        <p class="subtitle">检查前后端接口是否正常工作</p>
        
        <div class="test-group">
            <h2>1️⃣ 测试获取帖子列表</h2>
            <button onclick="testGetPosts()">运行测试</button>
            <div id="posts-result" class="result" style="display: none;"></div>
        </div>
        
        <div class="test-group">
            <h2>2️⃣ 测试获取用户信息</h2>
            <button onclick="testGetUser()">运行测试</button>
            <div id="user-result" class="result" style="display: none;"></div>
        </div>
        
        <div class="test-group">
            <h2>3️⃣ 测试 CORS 配置</h2>
            <button onclick="testCORS()">运行测试</button>
            <div id="cors-result" class="result" style="display: none;"></div>
        </div>
        
        <div class="test-group">
            <h2>4️⃣ 运行所有测试</h2>
            <button onclick="runAllTests()">全部运行</button>
        </div>
    </div>
    
    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/api/v1';
        
        function showResult(elementId, content) {
            const element = document.getElementById(elementId);
            element.innerHTML = content;
            element.style.display = 'block';
        }
        
        async function testGetPosts() {
            const resultId = 'posts-result';
            showResult(resultId, '<div class="info">⏳ 测试中...</div>');
            
            try {
                const response = await fetch(`${API_BASE_URL}/posts`);
                const posts = await response.json();
                
                if (response.ok) {
                    let html = `<div class="success">
                        <span class="status ok">✅ ${response.status}</span>
                        成功获取 ${posts.length} 个帖子
                    </div>`;
                    
                    if (posts.length > 0) {
                        html += `<pre>${JSON.stringify(posts[0], null, 2)}</pre>`;
                    } else {
                        html += '<div class="error">⚠️ 数据库中没有帖子，请先运行: python -m actions.create_test_data</div>';
                    }
                    
                    showResult(resultId, html);
                } else {
                    showResult(resultId, `<div class="error">
                        <span class="status fail">❌ ${response.status}</span>
                        请求失败
                        <pre>${JSON.stringify(posts, null, 2)}</pre>
                    </div>`);
                }
            } catch (error) {
                showResult(resultId, `<div class="error">
                    <span class="status fail">❌ 错误</span>
                    无法连接到后端
                    <pre>${error.message}</pre>
                    <p>请确保后端已启动: uvicorn app.main:app --reload</p>
                </div>`);
            }
        }
        
        async function testGetUser() {
            const resultId = 'user-result';
            showResult(resultId, '<div class="info">⏳ 测试中...</div>');
            
            try {
                const response = await fetch(`${API_BASE_URL}/users/username/张三`);
                const user = await response.json();
                
                if (response.ok) {
                    showResult(resultId, `<div class="success">
                        <span class="status ok">✅ ${response.status}</span>
                        成功获取用户信息
                    </div>
                    <pre>${JSON.stringify(user, null, 2)}</pre>`);
                } else {
                    showResult(resultId, `<div class="error">
                        <span class="status fail">❌ ${response.status}</span>
                        用户不存在
                        <p>请先运行: python -m actions.create_test_data</p>
                    </div>`);
                }
            } catch (error) {
                showResult(resultId, `<div class="error">
                    <span class="status fail">❌ 错误</span>
                    <pre>${error.message}</pre>
                </div>`);
            }
        }
        
        async function testCORS() {
            const resultId = 'cors-result';
            showResult(resultId, '<div class="info">⏳ 测试中...</div>');
            
            try {
                const response = await fetch(`${API_BASE_URL}/posts`, {
                    method: 'GET',
                    headers: {
                        'Origin': window.location.origin
                    }
                });
                
                const corsHeader = response.headers.get('access-control-allow-origin');
                
                if (corsHeader) {
                    showResult(resultId, `<div class="success">
                        <span class="status ok">✅ CORS 正常</span>
                        允许的源: ${corsHeader}
                    </div>`);
                } else {
                    showResult(resultId, `<div class="error">
                        <span class="status fail">⚠️ 警告</span>
                        未检测到 CORS 头部，可能会导致跨域问题
                    </div>`);
                }
            } catch (error) {
                showResult(resultId, `<div class="error">
                    <span class="status fail">❌ 错误</span>
                    <pre>${error.message}</pre>
                </div>`);
            }
        }
        
        async function runAllTests() {
            await testGetPosts();
            await new Promise(resolve => setTimeout(resolve, 500));
            await testGetUser();
            await new Promise(resolve => setTimeout(resolve, 500));
            await testCORS();
        }
    </script>
</body>
</html>
